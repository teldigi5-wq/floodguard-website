name: R2 Signed Water Receipt Emulator Acceptance

on:
  push:
    branches:
      - test/r2-signed-water-receipt-evidence-20261030
    paths:
      - 'experiments/r2-signed-water-receipt-evidence.mjs'
      - 'tests/strict-emulator-atomic-projector.mjs'
      - 'lib/telemetry-health.mjs'
      - 'docs/firebase/R2_SIGNED_WATER_RECEIPT_EVIDENCE_20261030.md'
      - '.github/workflows/r2-signed-water-receipt.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: r2-signed-water-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local RTDB Emulator signed-water contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup patched Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Setup Java for Firebase Emulator only
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reproducibly without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install emulator test-only dependency without changing lock
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Static contract and negative tests
        run: |
          node --check experiments/r2-signed-water-receipt-evidence.mjs
          node --test tests/telemetry-health.test.mjs
          npm test
      - name: Reconcile signed source against actual local RTDB Emulator
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-strict-projector --config firebase.phase-b-strict.json \
            "FG_STRICT_EMULATOR_PROJECTOR_TEST=1 node --test tests/strict-emulator-atomic-projector.mjs"
      - name: TypeScript and static lint validation
        run: |
          npm run typecheck
          npm run lint
