name: FloodGuard device-source revocation fence (Emulator only)
on:
  push:
    branches: [test/r2-r3-device-revocation-fence-20261101]
  pull_request:
    branches: [test/r2-r3-publisher-revocation-fence-20261101]
permissions:
  contents: read
concurrency:
  group: fg-device-revoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Java 17 for isolated RTDB Emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Locked dependencies, no lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Emulator-only rules test SDK
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Syntax and prior signed-source recovery tests
        run: |
          node --check experiments/device-revocation-fence-lab.mjs
          node --check tests/device-revocation-fence-emulator.mjs
          node --test tests/durable-admission-outbox-lab.test.mjs tests/immutable-publication-history-lab.test.mjs tests/pinned-historical-witness-lab.test.mjs
      - name: Real authenticated device revocation and public read gating
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-device-revocation-fence \
            --config firebase.device-revocation-fence-lab.json \
            "FG_REVOKE_FENCE_LAB=1 node --test tests/device-revocation-fence-emulator.mjs"
      - name: Website regression lint TypeScript build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
