name: FloodGuard H21 cross-surface report provenance (NO DEPLOY)

on:
  push:
    branches:
      - safety/r3-h21-public-cross-surface-reporting-20261104
  pull_request:
    branches:
      - safety/r3-h20-scene-fallback-reduced-motion-20261104

permissions:
  contents: read

jobs:
  offline-source-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked packages without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Source syntax and inherited regression tests
        run: |
          set -euo pipefail
          node --check lib/public-health-observation.mjs
          node --check tests/r3-h21-cross-surface-provenance.test.mjs
          npm test
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Next build (not deployment)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
