name: FloodGuard durable signed admission outbox (offline)
on:
  push:
    branches: [test/r2-durable-admission-outbox-20261101]
  pull_request:
    branches: [test/r2-r3-atomic-leaf-publication-20261101]
permissions:
  contents: read
concurrency:
  group: fg-durable-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact Stage 7 contract with restart and tamper negatives
        run: |
          node --check experiments/durable-admission-outbox-lab.mjs
          node --check tests/durable-admission-outbox-lab.test.mjs
          node --test tests/durable-admission-outbox-lab.test.mjs tests/stage7-durable-ingress.test.mjs
      - name: Existing site regression and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
