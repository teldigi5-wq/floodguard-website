name: R3 V2 Gateway-Owned Admission Time Lab
on:
  push:
    branches:
      - test/r3-v2-server-owned-admission-time-20261031
    paths:
      - 'experiments/r3-v2-admission-contract-lab.mjs'
      - 'experiments/r3-v2-server-admission-gate-lab.mjs'
      - 'tests/r3-v2-server-admission-lab.test.mjs'
      - 'tests/r3-v2-server-admission-emulator.mjs'
      - 'docs/firebase/r3-v2-admission-emulator.rules.json'
      - 'firebase.r3-v2-admission-lab.json'
      - 'docs/firebase/R3_V2_SERVER_ADMISSION_TIME_LAB_20261031.md'
      - 'docs/ENGINEERING_ROADMAP.md'
      - '.github/workflows/r3-v2-server-admission.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r3-v2-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify signed source separation, independent gateway time and RTDB rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use pinned patched Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Prepare isolated RTDB emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked npm dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Add only emulator rules test helper
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Run V2 server admission and browser verification tests
        run: |
          node --test tests/r3-v2-server-admission-lab.test.mjs
          node --test tests/r3-server-verified-ingest-gate-lab.test.mjs
      - name: Run all offline regression tests
        run: npm test
      - name: Run actual local Firebase V2 admission rules tests
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-r3-v2-admission --config firebase.r3-v2-admission-lab.json \
            "FG_R3_V2_ADMISSION_LAB_TEST=1 node --test tests/r3-v2-server-admission-emulator.mjs"
      - name: Verify TypeScript and ESLint
        run: |
          npm run typecheck
          npm run lint
