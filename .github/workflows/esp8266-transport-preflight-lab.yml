name: FloodGuard device HTTPS migration preflight (localhost only)
on:
  push:
    branches: [test/r2-esp8266-transport-preflight-20261101]
  pull_request:
    branches: [test/r2-r3-device-revocation-fence-20261101]
permissions:
  contents: read
concurrency:
  group: fg-esp-transport-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Locked install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check device transport adapter and local test syntax
        run: |
          node --check experiments/esp8266-transport-migration-preflight.mjs
          node --check tests/esp8266-transport-migration-preflight.test.mjs
      - name: Genuine loopback certificate-validated HTTPS and journal recovery
        run: |
          node --test tests/esp8266-transport-migration-preflight.test.mjs tests/loopback-durable-outbox-ingress.test.mjs tests/loopback-signed-https-ingress.test.mjs
      - name: Signed-source and replay regression
        run: |
          node --test tests/durable-admission-outbox-lab.test.mjs tests/immutable-publication-history-lab.test.mjs tests/pinned-historical-witness-lab.test.mjs
      - name: Website tests lint TypeScript build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
