name: FloodGuard R3 public payload audit (synthetic offline only)

on:
  push:
    branches:
      - test/r3-private-public-payload-audit-20261102
  pull_request:
    branches:
      - test/r3-public-read-rules-emulator-20261102
    paths:
      - 'scripts/r3-private-public-payload-audit.mjs'
      - 'tests/r3-private-public-payload-audit.test.mjs'
      - 'docs/firebase/R3_PRIVATE_PUBLIC_PAYLOAD_AUDIT_20261102.md'
      - '.github/workflows/r3-private-public-payload-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-offline-only:
    name: Check private-audit guard using synthetic values only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout with credentials disabled
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Offline syntax and synthetic redaction regression
        run: |
          set -euo pipefail
          node --check scripts/r3-private-public-payload-audit.mjs
          node --check tests/r3-private-public-payload-audit.test.mjs
          node --test tests/r3-private-public-payload-audit.test.mjs
