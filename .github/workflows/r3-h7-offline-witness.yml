name: FloodGuard R3 H7 offline incident and monotonic witness (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h7-offline-independent-witness-20261103
  pull_request:
    branches:
      - security/r3-h6-mandatory-publication-worker-20261103
    paths:
      - 'experiments/r3-h7-external-witness-lab.mjs'
      - 'experiments/r3-h7-offline-coordinator.mjs'
      - 'tests/r3-h7-external-witness.test.mjs'
      - 'docs/firebase/R3_H7_EXTERNAL_WITNESS_20261103.md'
      - '.github/workflows/r3-h7-offline-witness.yml'

permissions:
  contents: read

jobs:
  offline-witness:
    name: H7 signature/rollback/recovery and inherited security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run offline-only H7, H6 and existing H4 signer contracts
        run: |
          set -euo pipefail
          node --check experiments/r3-h7-external-witness-lab.mjs
          node --check experiments/r3-h7-offline-coordinator.mjs
          node --check tests/r3-h7-external-witness.test.mjs
          node --test \
            tests/r3-h7-external-witness.test.mjs \
            tests/r3-h6-mandatory-publication-rules.test.mjs \
            tests/r3-h5-scoped-issuer-rules.test.mjs \
            tests/r3-h4-signed-admission-issuer.test.mjs \
            tests/three-signer-water-projection-gate.test.mjs

  inherited-auth-rtdb:
    name: H6 Auth+RTDB Emulator no-client-write and signed CAS regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-r3-h6-publication
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install synthetic, no-lifecycle test-only libraries
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Require fixed demo Auth and RTDB targets
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-r3-h6-publication'
          node -e "const c=require('./firebase.r3-h6-mandatory-publication-lab.json');if(c.database.rules!=='docs/firebase/r3-h6-mandatory-publication-lab.rules.json'||c.emulators.database.host!=='127.0.0.1'||c.emulators.database.port!==9000||c.emulators.auth.host!=='127.0.0.1'||c.emulators.auth.port!==9099||c.emulators.singleProjectMode!==true)process.exit(1)"
      - name: Run H6 signed-only publication regressions (no H7 live integration)
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-h6-publication \
            --config firebase.r3-h6-mandatory-publication-lab.json \
            "GCLOUD_PROJECT=demo-r3-h6-publication node --test tests/r3-h6-mandatory-publication-emulator.mjs"
