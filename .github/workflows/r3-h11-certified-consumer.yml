name: FloodGuard R3 H11 signed consumer containment (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h11-certified-consumer-boundary-20261103
  pull_request:
    branches:
      - security/r3-h10-canonical-authority-lab-20261103
    paths:
      - 'experiments/r3-h11-certified-read-boundary.mjs'
      - 'tests/r3-h11-certified-read-boundary.test.mjs'
      - 'tests/r3-h10-canonical-authority-emulator.mjs'
      - 'docs/firebase/R3_H11_CERTIFIED_CONSUMER_BOUNDARY_20261103.md'
      - '.github/workflows/r3-h11-certified-consumer.yml'

permissions:
  contents: read

jobs:
  offline-signature-gate:
    name: H11 strict signed view, independent witness and all inherited security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: H11 syntax and offline signed publication adversarial checks
        run: |
          set -euo pipefail
          node --check experiments/r3-h11-certified-read-boundary.mjs
          node --check tests/r3-h11-certified-read-boundary.test.mjs
          node --check tests/r3-h10-canonical-authority-emulator.mjs
          node --test \
            tests/r3-h11-certified-read-boundary.test.mjs \
            tests/r3-h10-canonical-authority-rules.test.mjs \
            tests/r3-h9-atomic-incident-rules.test.mjs \
            tests/r3-h8-verified-readback-observer.test.mjs \
            tests/r3-h8-readback-observer-rules.test.mjs \
            tests/r3-h7-external-witness.test.mjs \
            tests/r3-h6-mandatory-publication-rules.test.mjs \
            tests/r3-h5-scoped-issuer-rules.test.mjs \
            tests/r3-h4-signed-admission-issuer.test.mjs \
            tests/three-signer-water-projection-gate.test.mjs

  h10-h11-emulator:
    name: Actual H10 commit/H7 witness/H11 attested read, owner-forgery negative
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-r3-h10-canonical
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install disposable demo libraries with no lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Refuse unexpected real cloud configuration
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-r3-h10-canonical'
          node --check tests/r3-h10-canonical-authority-emulator.mjs
          node -e "const c=require('./firebase.r3-h10-canonical-authority-lab.json');if(c.database.rules!=='docs/firebase/r3-h10-canonical-authority-lab.rules.json'||c.emulators.database.host!=='127.0.0.1'||c.emulators.database.port!==9000||c.emulators.auth.host!=='127.0.0.1'||c.emulators.auth.port!==9099||c.emulators.singleProjectMode!==true)process.exit(1)"
      - name: Verify signed read boundary against actual localhost Auth+RTDB record
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-h10-canonical \
            --config firebase.r3-h10-canonical-authority-lab.json \
            "GCLOUD_PROJECT=demo-r3-h10-canonical node --test tests/r3-h10-canonical-authority-emulator.mjs"
