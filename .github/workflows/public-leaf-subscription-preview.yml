name: FloodGuard leaf subscription preview lab
on:
  push:
    branches: [test/leaf-preview-subscriptions-20261101]
  pull_request:
    branches: [test/leaf-monitor-reconciliation-20261101]
permissions:
  contents: read
concurrency:
  group: fg-leaf-subscriptions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Secure subscription events and website regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
          cache: npm
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline subscriptions and projection regression
        run: node --test tests/public-leaf-subscription-adapter-lab.test.mjs tests/public-leaf-monitor-lab.test.mjs tests/public-telemetry-leaf-projection-lab.test.mjs
      - name: Full website checks
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
