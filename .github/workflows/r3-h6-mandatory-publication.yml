name: FloodGuard R3 H6 mandatory signed publication (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h6-mandatory-publication-worker-20261103
  pull_request:
    branches:
      - security/r3-h5-scoped-issuer-worker-20261103
    paths:
      - 'docs/firebase/r3-h6-mandatory-publication-lab.rules.json'
      - 'firebase.r3-h6-mandatory-publication-lab.json'
      - 'experiments/r3-h6-mandatory-publication-worker.mjs'
      - 'tests/r3-h6-mandatory-publication-emulator.mjs'
      - 'tests/r3-h6-mandatory-publication-rules.test.mjs'
      - '.github/workflows/r3-h6-mandatory-publication.yml'
      - 'docs/firebase/R3_H6_MANDATORY_PUBLICATION_20261103.md'

permissions:
  contents: read

jobs:
  exact-source-scope:
    name: H6 no-client-writes and inherited signed-protocol checks
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce exact Rules delta and offline cryptographic regressions
        run: |
          set -euo pipefail
          node --check experiments/r3-h6-mandatory-publication-worker.mjs
          node --check tests/r3-h6-mandatory-publication-emulator.mjs
          node --test tests/r3-h6-mandatory-publication-rules.test.mjs \
            tests/r3-h5-scoped-issuer-rules.test.mjs \
            tests/r3-h4-signed-admission-issuer.test.mjs \
            tests/three-signer-water-projection-gate.test.mjs

  auth-rtdb-demo:
    name: Actual Emulator forced signatures and stolen-client-token denial
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-r3-h6-publication
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install synthetic test-only dependencies, no lifecycle hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Require demo Auth and RTDB loopback and pinned Rules
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-r3-h6-publication'
          node --check tests/r3-h6-mandatory-publication-emulator.mjs
          node -e "const c=require('./firebase.r3-h6-mandatory-publication-lab.json');if(c.database.rules!=='docs/firebase/r3-h6-mandatory-publication-lab.rules.json'||c.emulators.database.host!=='127.0.0.1'||c.emulators.database.port!==9000||c.emulators.auth.host!=='127.0.0.1'||c.emulators.auth.port!==9099||c.emulators.singleProjectMode!==true)process.exit(1)"
      - name: Test mandatory signed commit in disposable Auth and RTDB Emulators
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-h6-publication \
            --config firebase.r3-h6-mandatory-publication-lab.json \
            "GCLOUD_PROJECT=demo-r3-h6-publication node --test tests/r3-h6-mandatory-publication-emulator.mjs"
