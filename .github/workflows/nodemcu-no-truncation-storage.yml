name: FloodGuard no-truncation NodeMCU and POSIX exclusive journal checks
on:
  push:
    branches: [security/r2-no-truncation-exclusive-journal-20261101, security/r2-littlefs-no-autoformat-20261101, test/r2-pinned-littlefs-exclusive-host-20261101, security/r2-littlefs-sticky-quarantine-20261101, test/r2-pinned-esp8266-api-access-boundary-20261101, test/r2-exclusive-write-lifecycle-20261101, test/r2-single-owner-core-api-overlay-20261101, test/r2-core-overlay-exact-host-faults-20261101, test/r2-core-overlay-torn-write-reentry-20261101, security/r2-eight-slot-boot-audit-20261101, test/r2-typed-probe-owner-queue-20261101, test/r2-owner-thread-host-dispatcher-20261101, test/r2-esp8266-loop-flash-evidence-20261101, test/r2-board-layout-evidence-gate-20261101, test/r2-resolved-build-layout-20261101, test/r2-private-flash-copy-integrity-20261101, security/r2-public-provenance-notice-20261101, security/r3-three-signer-projection-boundary-20261102, security/r3-independent-db-confirmation-issuer-20261102, security/r3-durable-offline-issuer-history-20261102, security/r3-serialized-local-issuer-revocation-20261102, security/r3-single-sqlite-authority-lab-20261102, security/r3-external-witness-rollback-detection-20261102, security/r3-real-authority-cutover-preflight-20261102, test/r3-real-emulator-token-versioned-authority-20261102, security/r3-restrict-direct-confirm-publish-rules-20261102, test/r3-service-confirmation-signatures-20261102]
  pull_request:
    branches: [test/r2-bounded-device-journal-20261101, security/r2-no-truncation-exclusive-journal-20261101, security/r2-littlefs-no-autoformat-20261101, test/r2-pinned-littlefs-exclusive-host-20261101, security/r2-littlefs-sticky-quarantine-20261101, test/r2-pinned-esp8266-api-access-boundary-20261101, test/r2-exclusive-write-lifecycle-20261101, test/r2-single-owner-core-api-overlay-20261101, test/r2-core-overlay-exact-host-faults-20261101, test/r2-core-overlay-torn-write-reentry-20261101, security/r2-eight-slot-boot-audit-20261101, test/r2-typed-probe-owner-queue-20261101, test/r2-owner-thread-host-dispatcher-20261101, test/r2-esp8266-loop-flash-evidence-20261101, test/r2-board-layout-evidence-gate-20261101, test/r2-resolved-build-layout-20261101, test/r2-private-flash-copy-integrity-20261101, security/r2-public-provenance-notice-20261101, security/r3-three-signer-projection-boundary-20261102, security/r3-independent-db-confirmation-issuer-20261102, security/r3-durable-offline-issuer-history-20261102, security/r3-serialized-local-issuer-revocation-20261102, security/r3-single-sqlite-authority-lab-20261102, security/r3-external-witness-rollback-detection-20261102, security/r3-real-authority-cutover-preflight-20261102, test/r3-real-emulator-token-versioned-authority-20261102, security/r3-restrict-direct-confirm-publish-rules-20261102]
permissions:
  contents: read
concurrency:
  group: fg-journal-no-truncation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-parser-and-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Refuse broad Admin capabilities and unverified real-world authority claims
        run: |
          node scripts/r3-real-authority-preflight.mjs
          node --test tests/r3-real-authority-preflight.test.mjs

      - name: Compiler-test the exact portable parser header used by the ESP sketch
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_v6_esp8266_parser.cpp -o /tmp/floodguard-v6-parser-test
          /tmp/floodguard-v6-parser-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_bearssl_response_policy.cpp -o /tmp/floodguard-tls-receipt-test
          /tmp/floodguard-tls-receipt-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_nodemcu_retained_frame.cpp -o /tmp/floodguard-retention-test
          /tmp/floodguard-retention-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_bounded_journal.cpp -o /tmp/floodguard-bounded-journal-test
          /tmp/floodguard-bounded-journal-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_littlefs_mount_health.cpp -o /tmp/floodguard-mount-health-test
          /tmp/floodguard-mount-health-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_exclusive_create_lifecycle.cpp -o /tmp/floodguard-exclusive-lifecycle-test
          /tmp/floodguard-exclusive-lifecycle-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_journal_boot_audit.cpp -o /tmp/fg-reboot-audit-test
          /tmp/fg-reboot-audit-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_read_only_owner_queue.cpp -o /tmp/fg-review-owner-queue-test
          /tmp/fg-review-owner-queue-test
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            tests/firmware_host_owner_read_dispatcher.cpp -o /tmp/fg-owner-thread-test
          /tmp/fg-owner-thread-test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/firmware_cooperative_loop_flash_inventory.cpp \
            -o /tmp/fg-loop-flash-inventory-test
          /tmp/fg-loop-flash-inventory-test
      - name: Validate synthetic NodeMCU board evidence without device access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'firmware_board_layout_evidence_test.py' -v
          python3 -m unittest discover -s tests -p 'firmware_resolved_build_layout_test.py' -v
          # Synthetic byte patterns only. No actual user flash images in CI.
          python3 -m unittest discover -s tests -p 'firmware_private_backup_pair_test.py' -v
          # The public template MUST be incomplete, never an operator permit.
          python3 -m json.tool \
            experiments/esp8266-core-excl-review/board_evidence_template.json >/dev/null
      - name: Review-only firmware static safety gate and legacy Node regression
        run: |
          node --test tests/firmware_v6_diagnostic_policy.test.mjs tests/firmware_bearssl_transport_policy.test.mjs tests/firmware_nodemcu_storage_policy.test.mjs tests/firmware_bounded_journal_policy.test.mjs tests/v6-serial-water-safety-preflight.test.mjs
          node --test tests/esp8266-transport-migration-preflight.test.mjs tests/loopback-durable-outbox-ingress.test.mjs tests/loopback-signed-https-ingress.test.mjs
      - name: Verify and execute the EXACT Arduino-pinned upstream LittleFS O_EXCL C implementation (host only)
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=6a53d76e90af33f0656333c1db09bd337fa75d23
          SRC="$(mktemp -d /tmp/fg-littlefs-upstream.XXXXXX)"
          # Hashes are Git blob identities for files AT the submodule SHA above.
          # Do not allow silently switching to a floating branch or newer ABI.
          for pair in \
            "lfs.h 2bce17f5ccb91236341f30994c1b8ff42fc06872" \
            "lfs.c 26280fa89509bb4f94ced008ac02cd60b5c2cff8" \
            "lfs_util.h 13e9396178c24286ef4d3548c029d844d0c3be3d" \
            "lfs_util.c 9cdd1c60ebec468cb3866bda48f0af5462742a57"
          do
            read -r name sha <<< "$pair"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
              "https://raw.githubusercontent.com/littlefs-project/littlefs/${UPSTREAM}/${name}" \
              -o "${SRC}/${name}"
            actual="$(git hash-object "${SRC}/${name}")"
            if [ "$actual" != "$sha" ]; then
              echo "Source revision mismatch for ${name}" >&2
              exit 1
            fi
          done
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            -DLFS_NO_DEBUG -DLFS_NO_WARN -DLFS_NO_ERROR \
            -I "$SRC" \
            tests/firmware_littlefs_pinned_exclusive_host.c \
            "$SRC/lfs.c" "$SRC/lfs_util.c" \
            -o /tmp/fg-littlefs-exclusive-host
          /tmp/fg-littlefs-exclusive-host
          # Compile upstream C as C (not C++) and link the exact patched
          # LittleFSImpl method against a disposable RAM-backed host driver.
          python3 experiments/esp8266-core-excl-review/generate_exact_overlay_host.py \
            /tmp/fg-core-overlay-exact-host.cpp
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            -DLFS_NO_DEBUG -DLFS_NO_WARN -DLFS_NO_ERROR \
            -I "$SRC" -c "$SRC/lfs.c" -o /tmp/fg-pinned-lfs.o
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            -DLFS_NO_DEBUG -DLFS_NO_WARN -DLFS_NO_ERROR \
            -I "$SRC" -c "$SRC/lfs_util.c" -o /tmp/fg-pinned-lfs-util.o
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic \
            -I "$SRC" /tmp/fg-core-overlay-exact-host.cpp \
            /tmp/fg-pinned-lfs.o /tmp/fg-pinned-lfs-util.o \
            -o /tmp/fg-core-overlay-exact-host
          /tmp/fg-core-overlay-exact-host
      - name: Real POSIX Linux exclusive file, symlink and process race tests
        run: |
          node --check experiments/exclusive-device-journal-fs-lab.mjs
          node --check tests/exclusive-device-journal-fs-lab.test.mjs
          node --test tests/exclusive-device-journal-fs-lab.test.mjs
      - name: Locked website dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full website tests lint types and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

  compile-esp8266:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install SHA256-verified Arduino CLI 1.5.1 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz \
            -o /tmp/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  /tmp/arduino-cli_1.5.1_Linux_64bit.tar.gz" | sha256sum --check
          mkdir -p /tmp/fg-arduino-bin
          tar -xzf /tmp/arduino-cli_1.5.1_Linux_64bit.tar.gz -C /tmp/fg-arduino-bin arduino-cli
          echo "/tmp/fg-arduino-bin" >> "$GITHUB_PATH"
      - name: Install version-locked ESP8266 Arduino core 3.1.2
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli version
          arduino-cli core update-index \
            --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 \
            --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core list
      - name: Verify installed ESP8266 3.1.2 NodeMCU menu flash definitions against upstream Git blob
        shell: bash
        run: |
          set -euo pipefail
          BOARDS="$HOME/.arduino15/packages/esp8266/hardware/esp8266/3.1.2/boards.txt"
          test -f "$BOARDS"
          python3 experiments/esp8266-core-excl-review/r2_board_layout_evidence.py \
            --boards "$BOARDS" --sdk-only
      - name: Cross-check explicit Arduino CLI resolved build properties for 4 NodeMCU FS menus (no compile/upload)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/.arduino15/packages/esp8266/hardware/esp8266/3.1.2/boards.txt"
          for MENU in 4M1M 4M2M 4M3M 4M; do
            FQBN="esp8266:esp8266:nodemcuv2:eesz=${MENU}"
            PROPERTIES="$(mktemp /tmp/fg-cli-physical-unknown.XXXXXX)"
            # CLI documentation: --show-properties prints resolved configuration
            # without compiling/uploading. The full output is never logged.
            arduino-cli compile --fqbn "$FQBN" --show-properties=expanded \
              firmware/esp8266_review_diagnostic > "$PROPERTIES"
            python3 experiments/esp8266-core-excl-review/r2_resolved_build_layout.py \
              --boards "$SDK" --properties "$PROPERTIES" --fqbn "$FQBN" --menu "$MENU"
            rm -f "$PROPERTIES"
          done
          echo "PASS 4 PINNED RESOLVED BUILD MENUS; NO PHYSICAL BOARD MEASUREMENT"
      - name: Real NodeMCU 1.0 ESP-12E GCC compile, no upload or artifacts
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --warnings all \
            --build-property compiler.cpp.extra_flags=-DFG_DIAGNOSTIC_BUILD_ONLY \
            firmware/esp8266_review_diagnostic
          echo "NODEMCU_NO_TRUNCATION_COMPILE_SUCCESS_NO_FLASH_NO_NETWORK"
      - name: Prove protected LittleFS access is REJECTED by the pinned NodeMCU compiler
        shell: bash
        run: |
          set -euo pipefail
          for symbol in GET_IMPL GET_FS; do
            log="$(mktemp /tmp/fg-core-abi-deny.XXXXXX)"
            if arduino-cli compile \
              --fqbn esp8266:esp8266:nodemcuv2 \
              --warnings all \
              --build-property "compiler.cpp.extra_flags=-DFG_CORE_ABI_NEGATIVE_TEST -DFG_NEGATIVE_${symbol}" \
              tests/firmware_negative_core_abi >"$log" 2>&1
            then
              echo "FAIL: protected ${symbol} unexpectedly compiled. Do not enable direct storage access." >&2
              exit 1
            fi
            expected="getImpl"
            if [ "$symbol" = "GET_FS" ]; then expected="getFS"; fi
            if ! grep -E "error:.*${expected}.*protected" "$log" >/dev/null; then
              echo "FAIL: negative build did not reject ${expected} for the expected protected-access reason." >&2
              tail -n 35 "$log" >&2
              exit 1
            fi
            echo "PASS pinned ESP8266 core rejects protected ${expected} access (NO DEVICE FLASH)"
          done

      - name: Apply source-locked single-owner LittleFS API overlay in disposable CI core (never flash)
        shell: bash
        run: |
          set -euo pipefail
          CORE="$HOME/.arduino15/packages/esp8266/hardware/esp8266/3.1.2"
          test -f "$CORE/libraries/LittleFS/src/LittleFS.cpp"
          python3 experiments/esp8266-core-excl-review/patch_core.py "$CORE"
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --warnings all \
            --build-property compiler.cpp.extra_flags=-DFG_ISOLATED_CORE_OVERLAY_REVIEW \
            experiments/esp8266-core-excl-review/compile_only_review
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --warnings all \
            --build-property compiler.cpp.extra_flags=-DFG_DIAGNOSTIC_BUILD_ONLY \
            firmware/esp8266_review_diagnostic
          echo "PASS PINNED ESP8266 SINGLE_OWNER_CORE_API OVERLAY COMPILES WITHOUT FLASH"
