name: FloodGuard leaf monitor reconciliation lab
on:
  push:
    branches: [test/leaf-monitor-reconciliation-20261101]
  pull_request:
    branches: [test/firebase-leaf-isolated-public-projection-20261031]
permissions:
  contents: read
concurrency:
  group: fg-leaf-monitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Read-only leaf reconciliation and website regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail-closed primitive-leaf monitor tests
        run: node --test tests/public-leaf-monitor-lab.test.mjs
      - name: Full website offline tests and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
