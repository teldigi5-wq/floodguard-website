name: Firebase Phase A rules verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/firebase/**'
      - 'firebase.phase-a.json'
      - 'tests/phase-a-*.test.mjs'
      - '.github/workflows/firebase-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-rules:
    name: Verify RTDB emulator authorization
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Check candidate policy against owner-supplied production validation
        run: node --test tests/phase-a-policy.test.mjs
      - name: Run Firebase Emulator access control regression suite
        run: npx --yes firebase-tools@14.18.0 emulators:exec --only database --project demo-floodguard --config firebase.phase-a.json "FG_EMULATOR=1 node --test tests/phase-a-rtdb-emulator.test.mjs"
