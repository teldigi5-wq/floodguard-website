name: R3 Atomic Dual-Attestation Evidence Lab
on:
  push:
    branches:
      - test/r3-atomic-dual-attestation-reader-lab-20261031
    paths:
      - 'experiments/r3-atomic-dual-attestation-reader-lab.mjs'
      - 'docs/firebase/r3-atomic-dual-attestation-lab.rules.json'
      - 'tests/r3-atomic-dual-attestation-reader-lab.test.mjs'
      - 'tests/r3-atomic-dual-attestation-emulator.mjs'
      - 'firebase.r3-atomic-dual-lab.json'
      - 'docs/firebase/R3_ATOMIC_DUAL_ATTESTATION_LAB_20261031.md'
      - '.github/workflows/r3-atomic-dual-attestation.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r3-atomic-attestation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify both pinned signatures and strict emulator leaf isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node 22 security patch baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Prepare Java for RTDB Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reproducible dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test-only Firebase rules helper
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Verify atomic browser receipt canonical parity and both signatures
        run: |
          node --test tests/r3-atomic-dual-attestation-reader-lab.test.mjs
          node --test tests/r3-browser-readonly-evidence-lab.test.mjs
      - name: Run complete offline application regression
        run: npm test
      - name: Verify atomic leaf permissions with live RTDB emulator
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-r3-atomic --config firebase.r3-atomic-dual-lab.json \
            "FG_R3_ATOMIC_DUAL_EMULATOR_TEST=1 node --test tests/r3-atomic-dual-attestation-emulator.mjs"
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
