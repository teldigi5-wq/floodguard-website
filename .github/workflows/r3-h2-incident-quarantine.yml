name: FloodGuard R3 H2 isolated incident quarantine (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h2-incident-quarantine-lab-20261103
  pull_request:
    branches:
      - review/r3-merged-public-child-rules-20261102
    paths:
      - 'docs/firebase/r3-h2-incident-quarantine-lab.rules.json'
      - 'firebase.r3-h2-incident-quarantine-lab.json'
      - 'tests/r3-isolated-service-confirmer-ipc-emulator.mjs'
      - 'tests/r3-h2-incident-quarantine-rules.test.mjs'
      - 'docs/firebase/R3_H2_INCIDENT_QUARANTINE_20261103.md'
      - '.github/workflows/r3-h2-incident-quarantine.yml'

permissions:
  contents: read

jobs:
  source-contract:
    name: H2 exact-scope Rules inspection (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check syntactic and authorization-only delta
        run: |
          set -euo pipefail
          node --version
          node --test tests/r3-h2-incident-quarantine-rules.test.mjs

  auth-rtdb-lab:
    name: Existing signed confirmer and quarantined attestor (AUTH+RTDB DEMO ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-r3-isolated-service-confirmer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ephemeral test-only packages
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Check lab confinement and syntax
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = "demo-r3-isolated-service-confirmer"
          node --check tests/r3-isolated-service-confirmer-ipc-emulator.mjs
          node -e "const f=require('./firebase.r3-h2-incident-quarantine-lab.json');if(f.database.rules!=='docs/firebase/r3-h2-incident-quarantine-lab.rules.json'||f.emulators.database.host!=='127.0.0.1'||f.emulators.database.port!==9000||f.emulators.auth.host!=='127.0.0.1'||f.emulators.auth.port!==9099)process.exit(1)"
      - name: Execute existing and H2 tests inside disposable local Auth+RTDB emulators
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-isolated-service-confirmer \
            --config firebase.r3-h2-incident-quarantine-lab.json \
            "FG_R3_READONLY_ATTESTOR_TEST=1 FG_VERSIONED_CONFIRMATION_TEST=1 FG_R3_ISOLATED_SERVICE_HARNESS=1 GCLOUD_PROJECT=demo-r3-isolated-service-confirmer node --test tests/r3-isolated-service-confirmer-ipc-emulator.mjs"
