name: FloodGuard R3 H10 canonical authority and revocation CAS (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h10-canonical-authority-lab-20261103
  pull_request:
    branches:
      - security/r3-h9-atomic-incident-crash-lab-20261103
    paths:
      - 'docs/firebase/r3-h10-canonical-authority-lab.rules.json'
      - 'firebase.r3-h10-canonical-authority-lab.json'
      - 'experiments/r3-h10-canonical-authority-worker.mjs'
      - 'tests/r3-h10-canonical-authority-emulator.mjs'
      - 'tests/r3-h10-canonical-authority-rules.test.mjs'
      - 'docs/firebase/R3_H10_CANONICAL_AUTHORITY_20261103.md'
      - '.github/workflows/r3-h10-canonical-authority.yml'

permissions:
  contents: read

jobs:
  inherited-crypto:
    name: Exact H10 Rules scope and all inherited three-signer / witness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax plus H10/H9/H8/H7/H4 regression suite
        run: |
          set -euo pipefail
          node --check experiments/r3-h10-canonical-authority-worker.mjs
          node --check tests/r3-h10-canonical-authority-emulator.mjs
          node --check tests/r3-h10-canonical-authority-rules.test.mjs
          node --test \
            tests/r3-h10-canonical-authority-rules.test.mjs \
            tests/r3-h9-atomic-incident-rules.test.mjs \
            tests/r3-h8-verified-readback-observer.test.mjs \
            tests/r3-h8-readback-observer-rules.test.mjs \
            tests/r3-h7-external-witness.test.mjs \
            tests/r3-h6-mandatory-publication-rules.test.mjs \
            tests/r3-h5-scoped-issuer-rules.test.mjs \
            tests/r3-h4-signed-admission-issuer.test.mjs \
            tests/three-signer-water-projection-gate.test.mjs

  auth-rtdb:
    name: H10 same-node device / publisher / issuer revocation and crash-boundary Emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-r3-h10-canonical
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install synthetic fixture libraries, no scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Refuse unexpected demo project, Firebase host, or Rules target
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-r3-h10-canonical'
          node --check tests/r3-h10-canonical-authority-emulator.mjs
          node -e "const c=require('./firebase.r3-h10-canonical-authority-lab.json');if(c.database.rules!=='docs/firebase/r3-h10-canonical-authority-lab.rules.json'||c.emulators.database.host!=='127.0.0.1'||c.emulators.database.port!==9000||c.emulators.auth.host!=='127.0.0.1'||c.emulators.auth.port!==9099||c.emulators.singleProjectMode!==true)process.exit(1)"
      - name: Run real localhost Auth+RTDB CAS tests and deterministic SIGKILL recovery
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-h10-canonical \
            --config firebase.r3-h10-canonical-authority-lab.json \
            "GCLOUD_PROJECT=demo-r3-h10-canonical node --test tests/r3-h10-canonical-authority-emulator.mjs"
