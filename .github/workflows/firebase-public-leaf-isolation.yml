name: Public telemetry primitive-leaf isolation lab
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/public-telemetry-leaf-projection-lab.mjs'
      - 'docs/firebase/public-telemetry-leaf-lab.rules.json'
      - 'firebase.public-telemetry-leaf-lab.json'
      - 'tests/public-telemetry-leaf-projection-lab.test.mjs'
      - 'tests/public-telemetry-leaf-emulator.mjs'
      - '.github/workflows/firebase-public-leaf-isolation.yml'
  push:
    branches: [test/firebase-leaf-isolated-public-projection-20261031]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fg-public-leaf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Primitive public leaf grants, private deny and full website regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 17 for localhost Firebase emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated emulator rules test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Unit-test exact whitelist, data stripping and schema drift
        run: node --test tests/public-telemetry-leaf-projection-lab.test.mjs
      - name: Verify actual Firebase rules on loopback demo only
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-public-leaf --config firebase.public-telemetry-leaf-lab.json \
            "FG_PUBLIC_LEAF_LAB=1 node --test tests/public-telemetry-leaf-emulator.mjs"
      - name: Run full offline website checks
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
