name: FloodGuard R3 H4 signed admission issuer (NO DEPLOY)

on:
  push:
    branches:
      - security/r3-h4-signed-admission-issuer-20261103
  pull_request:
    branches:
      - security/r3-h3-publisher-commit-fence-20261103
    paths:
      - 'experiments/r3-h4-signed-admission-issuer.mjs'
      - 'tests/r3-h4-signed-admission-issuer.test.mjs'
      - 'tests/r3-h3-publisher-commit-emulator.mjs'
      - 'docs/firebase/R3_H4_SIGNED_ADMISSION_ISSUER_20261103.md'
      - '.github/workflows/r3-h4-signed-admission.yml'

permissions:
  contents: read

jobs:
  signed-issuer-offline:
    name: Offline signed chain and authority-fence review (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax and ten signed-admission tests
        run: |
          set -euo pipefail
          node --check experiments/r3-h4-signed-admission-issuer.mjs
          node --check tests/r3-h4-signed-admission-issuer.test.mjs
          node --test tests/r3-h4-signed-admission-issuer.test.mjs \
            tests/three-signer-water-projection-gate.test.mjs

  inherited-h3-auth-rtdb:
    name: H3 and H4 actual Auth+RTDB Emulator regression (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-r3-h3-publisher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install disposable emulator-only libraries
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Pin demo project, loopback hosts and existing H3 Rules
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-r3-h3-publisher'
          node --check tests/r3-h3-publisher-commit-emulator.mjs
          node -e "const f=require('./firebase.r3-h3-publisher-commit-lab.json');if(f.database.rules!=='docs/firebase/r3-h3-publisher-commit-fence-lab.rules.json'||f.emulators.database.host!=='127.0.0.1'||f.emulators.database.port!==9000||f.emulators.auth.host!=='127.0.0.1'||f.emulators.auth.port!==9099||f.emulators.singleProjectMode!==true)process.exit(1)"
      - name: Exercise signed ticket issuance against H3 Rules at commit
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-h3-publisher \
            --config firebase.r3-h3-publisher-commit-lab.json \
            "GCLOUD_PROJECT=demo-r3-h3-publisher node --test tests/r3-h3-publisher-commit-emulator.mjs"
