name: FloodGuard recovered v6 serial safety preflight
on:
  push:
    branches: [test/r2-legacy-firmware-serial-safety-20261101]
  pull_request:
    branches: [test/r2-esp8266-transport-preflight-20261101]
permissions:
  contents: read
concurrency:
  group: fg-v6-serial-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and v6 serial water safety gate
        run: |
          node --check experiments/v6-serial-water-safety-preflight.mjs
          node --check tests/v6-serial-water-safety-preflight.test.mjs
          node --test tests/v6-serial-water-safety-preflight.test.mjs
      - name: Existing signed ingress and verified localhost HTTPS regressions
        run: |
          node --test tests/esp8266-transport-migration-preflight.test.mjs tests/loopback-durable-outbox-ingress.test.mjs tests/loopback-signed-https-ingress.test.mjs
      - name: Signed outbox and history witness regression
        run: |
          node --test tests/durable-admission-outbox-lab.test.mjs tests/immutable-publication-history-lab.test.mjs tests/pinned-historical-witness-lab.test.mjs
      - name: Full website lint TypeScript and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
