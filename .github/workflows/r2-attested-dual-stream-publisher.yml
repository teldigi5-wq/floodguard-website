name: R2 Dual Signature Publisher Acceptance

on:
  push:
    branches:
      - test/r2-attested-dual-stream-publisher-lab-20261030
    paths:
      - 'experiments/r2-attested-dual-stream-publisher.mjs'
      - 'tests/r2-attested-dual-stream-publisher.test.mjs'
      - 'tests/r2-attested-dual-stream-publisher-emulator.mjs'
      - 'docs/firebase/R2_ATTESTED_DUAL_STREAM_PUBLISHER_LAB_20261030.md'
      - '.github/workflows/r2-attested-dual-stream-publisher.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: r2-attested-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Signed receipt and scoped RTDB emulator acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup patched Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Setup Java for local Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible install without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test-only emulator rules dependency
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Verify pure dual-signature publication plan
        run: node --test tests/r2-attested-dual-stream-publisher.test.mjs
      - name: Offline application regressions
        run: npm test
      - name: Verify actual RTDB emulator replay/receipt acceptance
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-r2-attested --config firebase.r2-dual-stream-lab.json \
            "FG_R2_ATTESTED_PUBLISHER_LAB_TEST=1 node --test tests/r2-attested-dual-stream-publisher-emulator.mjs"
      - name: Check type safety and lint
        run: |
          npm run typecheck
          npm run lint
