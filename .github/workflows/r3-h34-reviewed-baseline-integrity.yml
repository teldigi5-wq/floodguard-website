name: FloodGuard H34 unambiguous reviewed Rules and IAM baselines (NO CLOUD)

on:
  push:
    branches:
      - security/r3-h34-unambiguous-reviewed-baselines-20261104
  pull_request:
    branches:
      - security/r3-h33-cli-checkout-root-pinning-20261104

permissions:
  contents: read

jobs:
  offline-dual-evidence-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      CI: 'true'
      FIREBASE_TOKEN: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - name: Checkout without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: No owner evidence or cloud credentials in CI
        run: |
          set -euo pipefail
          test -z "$FIREBASE_TOKEN"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test ! -e .floodguard-private-evidence
          node --check scripts/r3-private-json-evidence-core.mjs
          node --check scripts/r3-effective-rules-export-review.mjs
          node --check scripts/r3-h1b-authority-evidence-review.mjs
          node --check tests/r3-h1b-authority-evidence-review.test.mjs
      - name: Test reviewed baseline duplicate-key rejection and inherited private Rules/IAM guards
        run: |
          set -euo pipefail
          node --test \
            tests/r3-effective-rules-export-review.test.mjs \
            tests/r3-h1b-authority-evidence-review.test.mjs \
            tests/r3-h32-mandatory-private-file-scopes.test.mjs \
            tests/r3-h34-reviewed-baseline-integrity.test.mjs \
            tests/r3-real-authority-preflight.test.mjs
      - name: Install locked application dependencies without scripts
        run: npm ci --ignore-scripts
      - name: All inherited source regression tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Non-deploy Next.js static build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
