name: FloodGuard R2/R3 disposable RTDB composite
on:
  push:
    branches: [test/r2-r3-composite-emulator-20261101]
  pull_request:
    branches: [test/r2-signed-water-leaf-bridge-20261101]
permissions:
  contents: read
concurrency:
  group: fg-r2-r3-composite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    name: Signed proposal and isolated rules under loopback RTDB emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
          cache: npm
      - name: Java 17 for RTDB Emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Locked dependency install without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install emulator test-only package
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Pin and inspect isolated source manifests
        run: |
          node --test tests/strict-signed-projection-gate.test.mjs tests/signed-water-leaf-bridge-lab.test.mjs
      - name: Localhost-only signed-to-public RTDB access tests
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-r2-r3-composite \
            --config firebase.r2-r3-composite-lab.json \
            "FG_R2_R3_COMPOSITE_LAB=1 node --test tests/r2-r3-composite-emulator.mjs"
      - name: Existing website tests, lint, types and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
