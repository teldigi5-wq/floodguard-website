name: R2 signed water to isolated leaf bridge (offline)
on:
  push:
    branches: [test/r2-signed-water-leaf-bridge-20261101]
  pull_request:
    branches: [integration/firebase-r2-r3-consolidated-20261027]
permissions:
  contents: read
concurrency:
  group: fg-r2-leaf-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Receipt-gated scalar contract / offline website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout (no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run signed planner and isolated field contract
        run: node --test tests/strict-signed-projection-gate.test.mjs tests/signed-water-leaf-bridge-lab.test.mjs
      - name: Offline full website tests, lint, types and build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
