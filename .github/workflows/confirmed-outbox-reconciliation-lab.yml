name: FloodGuard signed outbox confirmation reconciliation (lab)
on:
  push:
    branches: [test/r2-r3-confirmed-outbox-reconciliation-20261101]
  pull_request:
    branches: [test/r2-loopback-durable-admission-20261101]
permissions:
  contents: read
concurrency:
  group: fg-outbox-confirm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Java 17 for RTDB emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Firebase emulator test-only SDK
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Typecheck source syntax and run offline signed journal confirmation tests
        run: |
          node --check experiments/confirmed-outbox-reconciliation-lab.mjs
          node --check tests/confirmed-outbox-reconciliation-lab.test.mjs
          node --check tests/confirmed-outbox-reconciliation-emulator.mjs
          node --test tests/confirmed-outbox-reconciliation-lab.test.mjs tests/loopback-durable-outbox-ingress.test.mjs tests/durable-admission-outbox-lab.test.mjs
      - name: Loopback RTDB emulator confirmed snapshot and authorization negatives
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-confirmed-outbox \
            --config firebase.r2-r3-composite-lab.json \
            "FG_CONFIRMED_OUTBOX_LAB=1 node --test tests/confirmed-outbox-reconciliation-emulator.mjs"
      - name: Full website tests, lint, TypeScript and Next.js build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
