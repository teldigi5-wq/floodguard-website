name: FloodGuard H18 unsigned diagnostic and export safeguards (NO DEPLOY)

on:
  push:
    branches:
      - safety/r3-h18-report-exports-provenance-20261104
  pull_request:
    branches:
      - safety/r3-h17-esp-child-failure-containment-20261104
    paths:
      - 'lib/public-observation-export.mjs'
      - 'lib/public-observation-export.d.mts'
      - 'app/diagnostics/page.tsx'
      - 'components/status-snapshot.tsx'
      - 'components/page-kit.tsx'
      - 'tests/r3-h18-report-export-provenance.test.mjs'
      - 'tests/alarm-freshness-safety.test.mjs'
      - '.github/workflows/r3-h18-report-export.yml'

permissions:
  contents: read

jobs:
  offline-report-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without retained GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup patched Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install lockfile dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Full offline regression suite
        run: |
          set -euo pipefail
          node --check lib/public-observation-export.mjs
          node --check tests/r3-h18-report-export-provenance.test.mjs
          npm test
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build Next without deploying
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
