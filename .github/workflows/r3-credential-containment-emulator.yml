name: FloodGuard R3 deny direct confirmer and publisher credentials (emulator only)

on:
  push:
    branches:
      - security/r3-restrict-direct-confirm-publish-rules-20261102
  pull_request:
    branches:
      - test/r3-real-emulator-token-versioned-authority-20261102
    paths:
      - 'docs/firebase/r3-credential-containment-lab.rules.json'
      - 'firebase.r3-credential-containment-lab.json'
      - 'tests/r3-contained-token-authority-emulator.mjs'
      - '.github/workflows/r3-credential-containment-emulator.yml'
      - 'docs/firebase/R3_CREDENTIAL_CONTAINMENT_BOUNDARY_20261102.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-compromised-role-tokens:
    name: Deny direct confirmed/publication writes using local Auth Emulator ID tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Java 17 for local Firebase Emulator
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test-only dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@14.5.0
      - name: Verify credential containment using strictly localhost Auth and RTDB
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec \
            --only auth,database \
            --project demo-r3-credential-containment \
            --config firebase.r3-credential-containment-lab.json \
            "FG_R3_CONTAINED_TOKENS_TEST=1 GCLOUD_PROJECT=demo-r3-credential-containment node --test tests/r3-contained-token-authority-emulator.mjs"
