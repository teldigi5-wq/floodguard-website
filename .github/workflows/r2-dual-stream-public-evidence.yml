name: R2 Dual Stream Public Evidence Emulator Lab

on:
  push:
    branches:
      - test/r2-dual-stream-public-evidence-lab-20261030
    paths:
      - 'experiments/r2-dual-stream-public-evidence.mjs'
      - 'tests/r2-dual-stream-public-evidence.test.mjs'
      - 'tests/r2-dual-stream-public-evidence-emulator.mjs'
      - 'docs/firebase/r2-dual-stream-public-evidence-lab.rules.json'
      - 'firebase.r2-dual-stream-lab.json'
      - 'docs/firebase/R2_DUAL_STREAM_PUBLIC_EVIDENCE_LAB_20261030.md'
      - '.github/workflows/r2-dual-stream-public-evidence.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: r2-dual-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dual-source signed evidence and scoped RTDB rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup patched Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Setup Java only for local Firebase Emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test-only Firebase rules dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @firebase/rules-unit-testing@5.0.2
      - name: Verify public evidence signature contract
        run: node --test tests/r2-dual-stream-public-evidence.test.mjs
      - name: Verify offline application regressions
        run: npm test
      - name: Verify scoped water and rain publishers in isolated RTDB Emulator
        run: |
          npx --yes firebase-tools@14.18.0 emulators:exec --only database \
            --project demo-fg-r2-dual-stream --config firebase.r2-dual-stream-lab.json \
            "FG_R2_DUAL_STREAM_EMULATOR_TEST=1 node --test tests/r2-dual-stream-public-evidence-emulator.mjs"
      - name: TypeScript and lint
        run: |
          npm run typecheck
          npm run lint
